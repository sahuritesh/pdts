<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="45%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- Distant hospital wing -->
  <g opacity="0.18" fill="#ffffff">
    <rect x="120" y="520" width="280" height="220" rx="4"/>
    <rect x="200" y="470" width="60" height="50"/>
    <rect x="215" y="485" width="10" height="30" fill="#ef4444" opacity="0.8"/>
    <rect x="205" y="495" width="30" height="10" fill="#ef4444" opacity="0.8"/>
    <rect x="150" y="560" width="30" height="30" opacity="0.5"/>
    <rect x="200" y="560" width="30" height="30" opacity="0.5"/>
    <rect x="250" y="560" width="30" height="30" opacity="0.5"/>
    <rect x="300" y="560" width="30" height="30" opacity="0.5"/>
  </g>
  <!-- Main hospital silhouette -->
  <g opacity="0.22" fill="#ffffff">
    <rect x="680" y="420" width="420" height="320" rx="6"/>
    <rect x="840" y="350" width="100" height="80"/>
    <rect x="870" y="375" width="16" height="50" fill="#ef4444" opacity="0.85"/>
    <rect x="852" y="392" width="52" height="16" fill="#ef4444" opacity="0.85"/>
    <rect x="720" y="480" width="45" height="45" opacity="0.45"/>
    <rect x="790" y="480" width="45" height="45" opacity="0.45"/>
    <rect x="860" y="480" width="45" height="45" opacity="0.45"/>
    <rect x="930" y="480" width="45" height="45" opacity="0.45"/>
    <rect x="1000" y="480" width="45" height="45" opacity="0.45"/>
    <rect x="720" y="560" width="45" height="45" opacity="0.45"/>
    <rect x="790" y="560" width="45" height="45" opacity="0.45"/>
    <rect x="860" y="560" width="45" height="45" opacity="0.45"/>
    <rect x="930" y="560" width="45" height="45" opacity="0.45"/>
    <rect x="1000" y="560" width="45" height="45" opacity="0.45"/>
  </g>
  <!-- Construction crane -->
  <g opacity="0.28">
    <path d="M1380 740 L1380 280 L1680 280 L1680 320 L1420 320 L1420 740 Z" fill="#f59e0b"/>
    <path d="M1380 280 L1680 280 L1650 230 L1410 230 Z" fill="#fbbf24"/>
    <line x1="1420" y1="320" x2="1620" y2="500" stroke="#f59e0b" stroke-width="8"/>
    <rect x="1600" y="500" width="70" height="35" rx="4" fill="#f59e0b"/>
    <rect x="1350" y="740" width="360" height="12" rx="2" fill="#f59e0b" opacity="0.7"/>
  </g>
  <!-- Hard hat accent -->
  <g opacity="0.15" transform="translate(300, 650)">
    <ellipse cx="60" cy="80" rx="70" ry="18" fill="#f59e0b"/>
    <path d="M0 80 Q60 10 120 80 Z" fill="#fbbf24"/>
    <rect x="20" y="72" width="80" height="12" rx="4" fill="#f59e0b"/>
  </g>
  <rect x="0" y="700" width="1920" height="380" fill="url(#ground)"/>
  <!-- Subtle blueprint lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" fill="none" stroke-width="2">
    <path d="M0 820 H1920"/>
    <path d="M200 700 V1080"/>
    <path d="M1720 700 V1080"/>
    <circle cx="960" cy="540" r="180"/>
  </g>
</svg>
