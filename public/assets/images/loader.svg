<svg xmlns="http://www.w3.org/2000/svg"
     width="200px" height="200px"
     viewBox="0 0 100 100"
     preserveAspectRatio="xMidYMid"
     style="display:block; margin:auto;">

  <!-- ROUND BACKGROUND -->
  <circle cx="50" cy="50" r="50" fill="#0d9488"/>

  <!-- LOADER DOTS -->
  <g transform="translate(80,50)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.875s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.875s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(71.21,71.21)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.75s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.75s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(50,80)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.625s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.625s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(28.79,71.21)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.5s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(20,50)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.375s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.375s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(28.79,28.79)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.25s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.25s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(50,20)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="-0.125s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="-0.125s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(71.21,28.79)">
    <circle r="6" fill="#ffffff">
      <animateTransform attributeName="transform" type="scale"
        begin="0s" values="1.5;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity"
        values="1;0" dur="1s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>